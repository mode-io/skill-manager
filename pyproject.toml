[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-manager"
dynamic = ["version"]
description = "Local app and browser UI for universal skill management across agent harnesses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi>=0.135,<0.136",
  "tomli-w>=1.2,<2",
  "ruamel.yaml>=0.18,<0.19",
  "uvicorn>=0.44,<0.45",
  "certifi>=2024.8.30,<2026",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
skill-manager = "skill_manager.cli:main"

[project.urls]
Homepage = "https://github.com/mode-io/skill-manager"
Repository = "https://github.com/mode-io/skill-manager"
Issues = "https://github.com/mode-io/skill-manager/issues"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "skill_manager.__version__" }

[tool.setuptools.packages.find]
include = ["skill_manager*"]

[tool.setuptools.package-data]
skill_manager = ["VERSION", "data/templates/*"]

# Static analysis -------------------------------------------------------------
# Ruff is the backend lint gate (per RECOMMENDATIONS.md §1.2). We adopt the
# highest-value, lowest-noise pair first and keep it GREEN on adoption:
#   * ``I``  -- import sorting (applied across the tree; enforced from here on)
#   * ``F``  -- pyflakes (redefinitions, unused names, etc.)
# Codes in ``ignore`` are the current baseline of pre-existing findings kept
# green on adoption; each is a deliberate "fix-later". Removing a code from
# ``ignore`` means the codebase now satisfies it and it is enforced — the list
# is meant to shrink over time. Broadening ``select`` (E/W/UP/B/...) is the
# follow-up once the deferred cleanup lands.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["I", "F"]
ignore = [
    "F401",  # unused imports — 29 pre-existing; drop in a verified follow-up PR.
    "F821",  # ruff false positives on conditional / TYPE_CHECKING-guarded names.
    "F841",  # intentionally-unused locals (mostly test readability).
]

